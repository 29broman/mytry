name: Daily EPG Translation (27 Channels to English)

on:
  schedule:
    # 06:00 AM WIB (Asia/Jakarta, UTC+7) = 23:00 UTC previous day
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download & Translate EPG
        run: python translate_epg.py --fetch

      - name: Commit and push updated EPG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yCBAAdapZF_translated_all.xml yCBAAdapZF_translated_27channels.xml schedule_en.md translations.json
          if git diff --staged --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "chore(epg): update translated English EPG ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
